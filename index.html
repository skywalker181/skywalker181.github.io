<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f3">
  <!-- EDIT: browser tab title -->
  <title>Personal homepage</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf8f3;
      --ink: #392e30;
      --muted: #695e5f;
      --rule: #ded4cf;
      --berry: #8a4252;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.65;
    }
    main {
      width: min(940px, calc(100% - 6rem));
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: clamp(5rem, 12vh, 9rem);
      display: grid;
      grid-template-columns: minmax(160px, 255px) minmax(0, 1fr);
      align-content: center;
      align-items: center;
      gap: clamp(3rem, 8vw, 7.5rem);
    }

    /* The picture is displayed at its original proportions. */
    .portrait {
      position: relative;
      width: 100%;
      margin: 0;
      background: #fffdf9;
      padding: 9px 9px 23px;
      border: 1px solid #e1d7d1;
      box-shadow: 0 12px 24px -14px #563a3840, 1px 4px 7px #563a3810;
      transform: rotate(-2deg);
    }
    .portrait::before {
      content: "";
      position: absolute;
      z-index: 1;
      top: -10px;
      left: 32%;
      width: 36%;
      height: 21px;
      background: repeating-linear-gradient(110deg, #e8cdb788 0 3px, #efdbc6aa 3px 6px);
      transform: rotate(5deg);
      pointer-events: none;
    }
    .portrait img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      background-color: #f3d6d4;
    }

    h1, h2 { font-family: var(--serif); font-weight: 400; }
    h1 {
      margin: 0 0 .44em;
      font-size: clamp(3.5rem, 7.4vw, 5.9rem);
      line-height: 1;
      letter-spacing: -.055em;
      overflow-wrap: anywhere;
    }
    section { border-top: 1px solid var(--rule); padding-block: 1.3rem 1.8rem; }
    section:last-child { padding-bottom: 0; }
    h2 {
      color: var(--berry);
      margin: 0 0 .32em;
      font-size: clamp(1.48rem, 2.4vw, 1.85rem);
      line-height: 1.25;
    }
    p { max-width: 58ch; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    p + p { margin-top: .75em; }
    a { color: var(--berry); text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--berry); outline-offset: 4px; }
    ::selection { background: #f2cdd3; color: var(--ink); }

    @media (max-width: 650px) {
      main {
        width: min(29rem, calc(100% - 3rem));
        grid-template-columns: minmax(0, 1fr);
        padding-block: 3rem;
        gap: 2.25rem;
      }
      .portrait { width: min(45%, 160px); justify-self: start; padding: 6px 6px 14px; }
      .portrait::before { height: 14px; top: -6px; }
      h1 { margin-bottom: .48em; }
      section { padding-block: 1rem 1.25rem; }
    }
  </style>
</head>
